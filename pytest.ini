[pytest]
markers =
    unit: Fast deterministic offline unit tests (mock graphs, synthetic data, pure python/torch/numpy numerical operations, 0 downloads, <10s)
    integration: Dataset-dependent integration tests requiring cached Planetoid or Reddit graphs
    slow: Long-running or training benchmark runs

filterwarnings =
    ignore::FutureWarning:torch.jit.*
norecursedirs = ETD_FGL_PAPER_HANDOFF ETD_FGL_NEW_CODE_HANDOFF ETD_FGL_PRE_WRITING_READY paper_artifacts .venv outputs data
