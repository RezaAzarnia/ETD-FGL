name: Continuous Integration & Scientific Verification

on:
  push:
    branches: [ main, master, "audit*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-compile:
    name: Syntax & Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .

  offline-unit-tests:
    name: Deterministic Offline Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and Minimal Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install torch-geometric numpy scipy scikit-learn networkx pytest matplotlib
      - name: Run Deterministic Unit Tests (No Network Downloads)
        run: |
          pytest -v test_audit_regressions.py test_stage2_alignment.py test_homophily_leakage_fix.py test_stage4_3_fedtge_verification.py test_final_5d_descriptor.py
